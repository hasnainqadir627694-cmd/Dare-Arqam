<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer Circular Shadow/Aura -->
  <defs>
    <filter id="neonGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#F5D900" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242680" />
      <stop offset="70%" stop-color="#1B1C63" />
      <stop offset="100%" stop-color="#0F103A" />
    </radialGradient>
  </defs>

  <!-- Base Circle with Royal Navy Gradient -->
  <circle cx="256" cy="256" r="248" fill="url(#navyBg)" stroke="url(#goldGradient)" stroke-width="12" />
  
  <!-- Outer Dotted Golden Rim -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFF000" stroke-width="3" stroke-dasharray="8 8" opacity="0.9" />
  
  <!-- Inner Border Accent -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#3B3EB0" stroke-width="4" />

  <!-- Crescent and Star in Upper Field -->
  <path d="M 256 90 A 62 62 0 1 0 298 190 A 49 49 0 1 1 256 90 Z" fill="#FFFFFF" />
  <polygon points="296,120 306,140 326,140 310,154 316,174 296,160 276,174 282,154 266,140 286,140" fill="#FFF000" />

  <!-- Open Academic Book of Knowledge -->
  <path d="M 160 276 C 204 256, 246 260, 256 288 C 266 260, 308 256, 352 276 L 352 358 C 308 338, 266 342, 256 368 C 246 342, 204 338, 160 358 Z" fill="#FFFFFF" stroke="#171852" stroke-width="6" stroke-linejoin="round" />
  <line x1="256" y1="288" x2="256" y2="368" stroke="#171852" stroke-width="6" stroke-linecap="round" />

  <!-- Book Pages Subtle Lines -->
  <line x1="184" y1="298" x2="236" y2="288" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="184" y1="316" x2="236" y2="306" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="184" y1="334" x2="236" y2="324" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

  <line x1="276" y1="288" x2="328" y2="298" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="276" y1="306" x2="328" y2="316" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  <line x1="276" y1="324" x2="328" y2="334" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

  <!-- Golden Laurel Wreaths -->
  <path d="M 112 280 C 102 328, 128 390, 180 416" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />
  <path d="M 400 280 C 410 328, 384 390, 332 416" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" />

  <!-- Foundation Year Seal -->
  <text x="256" y="432" text-anchor="middle" fill="#FFF000" font-size="28" font-weight="800" font-family="'Plus Jakarta Sans', system-ui, sans-serif" letter-spacing="3">EST. 1998</text>
  
  <!-- Institution Title Arc -->
  <text x="256" y="70" text-anchor="middle" fill="#FFF000" font-size="18" font-weight="700" font-family="'Cinzel', Georgia, serif" letter-spacing="5">DAR - E - ARQAM</text>
</svg>
